<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Saurely</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff5fa, #fff0f6); min-height: 100vh; }
        .card { border: none; border-radius: 20px; box-shadow: 0 8px 32px rgba(240,98,146,.15); }
        .btn-saurely { background: #F06292; border: none; color: white; border-radius: 30px; }
        .btn-saurely:hover { background: #e0527e; color: white; }
        .logo { color: #D4AF37; font-size: 28px; font-weight: 700; }
        .form-control:focus { border-color: #F06292; box-shadow: 0 0 0 .2rem rgba(240,98,146,.25); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <div class="logo">🌙 Saurely</div>
                    <h4 class="fw-bold mt-2">Crear Cuenta</h4>
                    <p class="text-muted">Completa los datos para registrarte</p>
                </div>
                <div id="alerta"></div>
                <div class="card">
                    <div class="card-body p-4">
                        <form onsubmit="event.preventDefault(); registro()">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text" id="inputNombre" class="form-control"
                                    placeholder="Tu nombre completo" autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" id="inputEmail" class="form-control"
                                    placeholder="correo@ejemplo.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" id="inputPassword" class="form-control"
                                    placeholder="Mínimo 6 caracteres">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-saurely py-2" id="btnRegistro">
                                    Registrarme
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center mt-3 text-muted">
                    ¿Ya tienes cuenta? <a href="login.html" style="color:#F06292;">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>
    <script src="./js/registro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
