<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto | Saurely</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fdf8fc; }
        .navbar { background: linear-gradient(90deg, #D4AF37, #F06292) !important; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.06); }
        .btn-saurely { background: #F06292; border: none; color: white; border-radius: 30px; }
        .btn-saurely:hover { background: #e0527e; color: white; }
        .form-control:focus, .form-select:focus { border-color: #F06292; box-shadow: 0 0 0 .2rem rgba(240,98,146,.25); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🌙 Saurely</span>
            <div class="ms-auto d-flex gap-2">
                <a href="productos.html" class="btn btn-outline-light btn-sm">← Volver</a>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <h3 class="fw-bold mb-4">💄 Nuevo Producto</h3>
                <div id="alerta"></div>
                <div class="card">
                    <div class="card-body p-4">
                        <form onsubmit="event.preventDefault(); registrar()">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre del producto *</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej: Labial Velvet Moon" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea id="descripcion" class="form-control" rows="3" placeholder="Descripción del producto"></textarea>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Precio (MXN) *</label>
                                    <input type="number" id="precio" class="form-control" placeholder="0.00" min="0" step="0.01" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Stock *</label>
                                    <input type="number" id="stock" class="form-control" placeholder="0" min="0" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Categoría *</label>
                                    <select id="categoria_id" class="form-select" required>
                                        <option value="">Selecciona categoría</option>
                                        <option value="1">Labiales</option>
                                        <option value="2">Bases y BB Cream</option>
                                        <option value="3">Rubores</option>
                                        <option value="4">Sérums</option>
                                        <option value="5">Cremas</option>
                                        <option value="6">Protectores</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Tipo de piel *</label>
                                    <select id="tipo_piel" class="form-select" required>
                                        <option value="">Selecciona tipo</option>
                                        <option value="grasa">Piel grasa</option>
                                        <option value="seca">Piel seca</option>
                                        <option value="mixta">Piel mixta</option>
                                        <option value="todos">Para todos</option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-saurely px-4" id="btnGuardar">
                                    Guardar Producto
                                </button>
                                <a href="productos.html" class="btn btn-outline-secondary px-4">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/productos-registrar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
