<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cliente | Saurely</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fdf8fc; }
        .navbar { background: linear-gradient(90deg, #D4AF37, #F06292) !important; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.06); }
        .btn-saurely { background: #F06292; border: none; color: white; border-radius: 30px; }
        .btn-saurely:hover { background: #e0527e; color: white; }
        .form-control:focus, .form-select:focus { border-color: #F06292; box-shadow: 0 0 0 .2rem rgba(240,98,146,.25); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🌙 Saurely</span>
            <div class="ms-auto d-flex gap-2">
                <a href="clientes.html" class="btn btn-outline-light btn-sm">← Volver</a>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h3 class="fw-bold mb-4"> Nueva Cliente</h3>
                <div id="alerta"></div>
                <div class="card">
                    <div class="card-body p-4">
                        <form onsubmit="event.preventDefault(); registrar()">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre completo *</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Nombre de la cliente" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email *</label>
                                <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password *</label>
                                <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Teléfono</label>
                                <input type="text" id="telefono" class="form-control" placeholder="55 1234 5678">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-saurely px-4" id="btnGuardar">
                                    Guardar Cliente
                                </button>
                                <a href="clientes.html" class="btn btn-outline-secondary px-4">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/clientes-registrar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
