<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Saurely</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fdf8fc; }
        .navbar { background: linear-gradient(90deg, #D4AF37, #F06292) !important; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.06); }
        .btn-saurely { background: #F06292; border: none; color: white; border-radius: 30px; }
        .btn-saurely:hover { background: #e0527e; color: white; }
        .table th { background: #fdf2f7; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#F06292,#D4AF37); display:inline-flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:13px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🌙 Saurely</span>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white" id="nombreUsuario"></span>
                <a href="inicio.html" class="btn btn-outline-light btn-sm">Inicio</a>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="alerta"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">👩 Clientes</h3>
            <a href="clientes-registrar.html" class="btn btn-saurely">+ Nueva Cliente</a>
        </div>

        <!-- Buscador -->
        <div class="card p-3 mb-4">
            <div class="row g-2">
                <div class="col-md-6">
                    <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre o email...">
                </div>
                <div class="col-md-3">
                    <select id="filtroPiel" class="form-select">
                        <option value="">Todos los tipos de piel</option>
                        <option value="grasa">Piel grasa</option>
                        <option value="seca">Piel seca</option>
                        <option value="mixta">Piel mixta</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-saurely w-100" onclick="buscar()">🔍 Buscar</button>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-body p-0">
                <div id="spinner" class="text-center py-5">
                    <div class="spinner-border" style="color:#F06292;"></div>
                    <p class="text-muted mt-2">Cargando clientes...</p>
                </div>
                <div id="tablaWrap" class="d-none">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4">Cliente</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Tipo de Piel</th>
                                <th>Registro</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaClientes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/clientes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
