<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Saurely</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #fdf8fc; }
        .navbar { background: linear-gradient(90deg, #D4AF37, #F06292) !important; }
        .card-modulo { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.06); transition: transform .2s; cursor: pointer; }
        .card-modulo:hover { transform: translateY(-4px); }
        .card-stat { border: none; border-radius: 16px; background: linear-gradient(135deg, #fff5fa, #fff0f6); border: 1px solid #f7cce0; }
        .btn-saurely { background: #F06292; border: none; color: white; border-radius: 30px; }
        .btn-saurely:hover { background: #e0527e; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🌙 Saurely</span>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white" id="nombreUsuario"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div id="alerta"></div>
        <div id="spinner" class="text-center py-5">
            <div class="spinner-border" style="color:#F06292;"></div>
            <p class="text-muted mt-2">Cargando...</p>
        </div>
        <div id="contenido" class="d-none">
            <h2 class="fw-bold mb-1" id="tituloBienvenida"></h2>
            <p class="text-muted mb-4" id="fechaHora"></p>
            <h5 class="fw-semibold mb-3">Módulos del sistema</h5>
            <div class="row g-3" id="tarjetasModulos"></div>
        </div>
    </div>

    <script src="./js/inicio.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
